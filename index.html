<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>PragyaSpace</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0B0F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bk:#0B0B0F;--nv:#101C30;--au:#C5A46D;--cr:#F1E8D8;--ch:#191B22}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 30% 0,var(--nv),var(--bk) 70%);color:var(--cr);font:15px -apple-system,system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
h1,h2,h3,.serif{font-family:Georgia,'Times New Roman',serif;font-weight:400;color:var(--au);margin:0 0 10px}
nav{background:#08080b;border-bottom:1px solid #C5A46D33;padding:8px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:2px;position:relative;z-index:2}
nav h1{font-size:20px;margin:0 18px 0 0}
nav button{background:none;border:0;color:var(--cr);text-align:left;padding:10px 12px;border-radius:10px;font-size:14px;cursor:pointer}
nav button:hover,nav button.on{background:#C5A46D22;color:var(--au)}
main{flex:1;overflow:auto;padding:22px 40px;position:relative;z-index:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.lab{letter-spacing:3px;font-size:13px;opacity:.7}.badge{display:inline-block;background:#C5A46D22;border-radius:14px;padding:5px 14px;margin:6px 0}.ico button{background:none;border:0;color:var(--au);font-size:34px;cursor:pointer}.pr{font-size:11px;border:1px solid var(--au);border-radius:8px;padding:1px 7px;margin-left:6px;color:var(--au)}.pr.High{background:#C5A46D33}.vid{background:#ffffff0d;border-radius:14px;min-height:190px;display:grid;place-items:center;color:#ffffff88;margin-bottom:10px;overflow:hidden}.comprow{display:flex;gap:16px;align-items:center;margin-top:8px}.av{width:64px;height:64px;border-radius:50%;border:2px solid var(--au);object-fit:cover;display:grid;place-items:center;font:28px Georgia;color:var(--au);background:var(--nv);flex:none}
.deco{position:fixed;font-size:44px;opacity:.1;pointer-events:none;z-index:0;animation:fl2 7s ease-in-out infinite alternate}@keyframes fl2{to{transform:translateY(-14px) rotate(6deg)}}
#pop{position:fixed;right:22px;bottom:22px;width:340px;background:linear-gradient(145deg,#101C30,#0B0B0F);border:1px solid var(--au);border-radius:16px;padding:14px;display:flex;gap:12px;box-shadow:0 0 28px #C5A46D55;opacity:0;transform:translateY(12px);transition:.5s;z-index:97;pointer-events:none}#pop.s{opacity:1;transform:none;pointer-events:auto}#pop .x{position:absolute;right:8px;top:4px;background:none;border:0;color:var(--cr);cursor:pointer}
.view{display:none}.view.on{display:block}
.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}
.card{background:var(--ch);border:1px solid #C5A46D40;border-radius:18px;padding:20px;box-shadow:0 0 30px #C5A46D10;margin-bottom:18px}
.big{font:300 84px Georgia,serif;color:var(--cr);text-align:center;letter-spacing:2px;text-shadow:0 0 30px #C5A46D55}
.clock{text-align:center;color:var(--au);font-size:18px}
button.b,.row button{background:#C5A46D22;border:1px solid var(--au);color:var(--au);padding:9px 16px;border-radius:12px;cursor:pointer;font-size:14px;margin:3px}
button.b:hover{background:var(--au);color:var(--bk)}button.p{background:var(--au);color:var(--bk);font-weight:600}
input,textarea,select{background:var(--bk);color:var(--cr);border:1px solid #C5A46D55;border-radius:10px;padding:9px;font:inherit;width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row input{flex:1}
.ctr{text-align:center}
.task{border-bottom:1px solid #ffffff10;padding:10px 0}
.chk{appearance:none;width:22px;height:22px;border:2px solid var(--au);border-radius:7px;cursor:pointer;display:inline-grid;place-content:center;vertical-align:middle;margin-right:8px;flex:none;width:22px;padding:0}
.chk:checked{background:var(--au);animation:pop .35s}.chk:checked::after{content:"✓";color:var(--bk);font-weight:700}
@keyframes pop{50%{transform:scale(1.35);box-shadow:0 0 20px var(--au)}}
.done{text-decoration:line-through;opacity:.5}
.bar{height:6px;background:#ffffff15;border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--au);transition:width .5s}
.comp img{width:100%;max-height:230px;object-fit:cover;border-radius:14px;border:1px solid var(--au)}
.bub{background:#C5A46D1f;border-radius:14px;padding:12px;margin-top:10px;font-style:italic}
.small{font-size:12px;opacity:.7}
#focus,#sos{position:fixed;inset:0;display:none;z-index:50;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#focus{background:#000}#focus .big{font-size:170px}
#sos{background:#05060a;padding:30px}
#toast{position:fixed;left:24px;bottom:24px;background:var(--au);color:var(--bk);padding:14px 20px;border-radius:14px;opacity:0;transition:.4s;z-index:99;max-width:340px;pointer-events:none}
#toast.s{opacity:1}
.sp{position:fixed;pointer-events:none;color:var(--au);font-size:20px;animation:fl 1s forwards;z-index:98}@keyframes fl{to{transform:translateY(-80px);opacity:0}}
.fb{background:none;border:1px solid #C5A46D55;color:var(--cr);padding:8px 14px;border-radius:10px;margin:4px;cursor:pointer}
iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px}
.slot{border-left:3px solid var(--au);padding-left:8px;background:#C5A46D12}.old{opacity:.4}
@keyframes rv{from{opacity:0;transform:scale(.94);filter:blur(6px)}}#slotbox{min-height:70px}
.bub:empty{display:none}
.li{display:flex;align-items:center;gap:8px;border-bottom:1px solid #ffffff10;padding:8px 0}.li .fb{margin:0;padding:2px 10px}.li>.fb:last-child{margin-left:auto}.li .pr{margin-left:0}
.li .av{width:38px;height:38px;font-size:18px;border-width:1px}.li input:not([type=checkbox]){flex:1;min-width:0}.li label{font-size:13px;opacity:.85;cursor:pointer;white-space:nowrap}
input[type=checkbox]:not(.chk){width:auto;padding:0;accent-color:var(--au)}
.who{display:flex;align-items:center;gap:8px;flex:1;cursor:pointer;min-width:0}.who:hover span{color:var(--au)}.desc{padding:0 0 10px 46px}.desc textarea{font-size:13px;resize:vertical}.ch:last-child .li{border-bottom:0}.fb:disabled{opacity:.6;cursor:default}
label.fb.on{background:#C5A46D33;border-color:var(--au)}
.ret{margin-top:28px;background:transparent;border:1px solid var(--au);color:var(--au);padding:14px 40px;border-radius:999px;font:15px Georgia,'Times New Roman',serif;letter-spacing:3px;text-transform:uppercase;cursor:pointer;transition:.3s}
.ret span{display:inline-block;margin-left:8px;transition:.3s}
.ret:hover{background:var(--au);color:var(--bk);box-shadow:0 0 30px #C5A46D66;transform:translateY(-2px)}.ret:hover span{transform:translateX(5px)}
.shf{width:38px;height:38px;border-radius:50%;border:1px solid var(--au);background:#C5A46D14;color:var(--au);display:grid;place-items:center;cursor:pointer;padding:0;transition:.25s}.shf:hover{background:var(--au);color:var(--bk);box-shadow:0 0 18px #C5A46D66;transform:rotate(180deg)}
.ico button{width:84px;height:84px;border:2px solid var(--au);border-radius:50%;margin:14px 0;transition:.2s}.ico button:hover{background:var(--au);color:var(--bk)}
@media(max-width:800px){.two,.grid{grid-template-columns:1fr}main{padding:16px 14px}.big{font-size:60px}#focus .big{font-size:96px}nav h1{margin-right:8px}}
</style></head><body>
<nav><h1>✦ PragyaSpace</h1>
<button data-v="dash" class="on">Focus</button><button data-v="brk">Break Room</button><button data-v="todo">Missions</button><button data-v="comp">Study Buddy</button><button data-v="park">Parking Lot</button><button id="sosBtn" style="color:#e8a">SOS</button>
</nav>
<main>
<section id="dash" class="view on"><div class="two">
<div class="card ctr"><div class="lab">FOCUS SESSION ☕</div><div class="big" id="cd">90:00</div>
<div class="ico"><button id="pbtn" onclick="pauseT()" title="Start / Pause" aria-label="Start / Pause">▶</button></div><button class="fb" onclick="openFocus()" title="Full-screen focus view (press F)">Focus view</button></div>
<div class="card"><h3>Today's plan</h3><div id="mission"></div><div class="small" id="mcount"></div></div></div>
<div class="card"><h3>Your study companion 🕯️</h3>
<div class="comprow" style="margin:0 0 14px"><div id="cav"></div><div style="flex:1"><div class="bub" id="cmsg"></div><div class="small" id="cname"></div></div><div><button class="fb" onclick="say('study',1)">Another message</button><button class="fb" onclick="speak($('#cmsg').textContent)">🔊</button></div></div>
</div>
<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"><h3 style="margin:0">Tomorrow's timetable</h3><button class="shf" onclick="shuffleTmr()" title="Shuffle tomorrow's order" aria-label="Shuffle tomorrow's order"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg></button></div><div id="tmr"></div></div>
</section>

<section id="todo" class="view"><h2>Missions</h2>
<div class="two">
<div class="card"><h3>Tomorrow — flexible</h3>
<div class="row"><input id="nt" placeholder="Add a mission" onkeydown="if(event.key=='Enter')addTask()"><input id="tmh" onkeydown="if(event.key=='Enter')addTask()" type="number" min="0" max="24" step="1" value="1" title="Hours" style="width:64px;flex:none"><span class="small">hr</span><input id="tmm" onkeydown="if(event.key=='Enter')addTask()" type="number" min="0" max="59" step="5" value="0" title="Minutes" style="width:64px;flex:none"><span class="small">min</span><select id="pri" style="width:auto"><option>High</option><option selected>Medium</option><option>Low</option></select><button class="b" onclick="addTask()">Add</button></div>
<div class="small" id="cap" style="margin:10px 0 4px"></div><div id="nofit"></div><div id="tl"></div></div>
<div class="card"><h3>Tomorrow — fixed time</h3>
<div class="row"><input id="fn" placeholder="Name"><input id="fs" type="time" style="width:116px;flex:none"><input id="fe" type="time" style="width:116px;flex:none"><label class="small"><input type="checkbox" id="fr" checked style="width:auto"> daily</label><button class="b" onclick="addFx()">Add</button></div>
<div id="fxl"></div></div></div>
<div class="card"><h3>Break tasks</h3>
<div class="row"><input id="bd" placeholder="Add a break task" onkeydown="if(event.key=='Enter')addBd()"><button class="b" onclick="addBd()">Add</button></div>
<div id="bdl"></div></div></section>



<section id="comp" class="view"><h2>Study Buddy ☕</h2>
<div class="card"><div class="row"><label><input type="checkbox" id="po" onchange="setP('on',this.checked)"> Pop-ups</label><label><input type="checkbox" id="pm" onchange="setP('mute',this.checked)"> Mute</label><label><input type="checkbox" id="pt" onchange="setP('tts',this.checked)"> Read aloud</label>
<select id="pe" onchange="setP('every',+this.value)" style="width:auto;margin-left:auto"><option value="5">every 5 min</option><option value="10">every 10 min</option><option value="15">every 15 min</option><option value="20">every 20 min</option><option value="30">every 30 min</option><option value="0">milestones only</option></select></div></div>
<div class="card"><h3>Characters</h3><div id="chars"></div>
<div class="row" style="margin-top:12px"><input id="an" placeholder="New character" onkeydown="if(event.key=='Enter')addChar()"><label class="fb" title="Add a portrait">📷<input type="file" id="ai" accept="image/*" hidden onchange="this.parentNode.classList.toggle('on',this.files.length>0)"></label><button class="b" onclick="addChar()">Add</button></div></div></section>

<section id="brk" class="view"><h2>Break Room</h2><div class="card ctr"><div class="serif" id="bact" style="font-size:30px;margin:14px 0 10px"></div><button class="fb" id="bdb" onclick="breakDone()" style="display:none;margin-bottom:8px">Done</button>
<div class="big" id="bcd" style="font-size:72px">30:00</div>
<button class="ret" onclick="returnStudy()">Return to study now<span>→</span></button></div></section>

<section id="park" class="view"><h2>Distraction Parking Lot</h2><div class="card"><div class="row"><input id="pi" placeholder="What's pulling at you?" onkeydown="if(event.key=='Enter')addPark()"><button class="b" onclick="addPark()">Park it</button></div><div id="pl"></div></div></section>


</main>

<div id="focus"><div class="clock" id="fnow"></div><div class="big" id="fcd"></div><div class="serif" id="ftask"></div><div class="bar" style="width:50%"><i id="fpg"></i></div>
<div><button class="fb" onclick="pauseT()">Pause / Resume</button><button class="fb" onclick="document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()">Fullscreen</button><button class="fb" onclick="closeFocus()">Exit</button></div>
<div style="margin-top:14px;width:380px"><input id="fpi" placeholder="Distracted? Park the thought here, press Enter"></div></div>

<div id="sos"><h2 style="font-size:34px">You don't have to finish it. Just begin.</h2><div id="sosBody" style="max-width:520px;width:100%"></div><button class="fb" onclick="closeSos()" style="margin-top:20px">Close</button></div>
<div id="pop"></div><div id="toast"></div><span class="deco" style="left:3%;top:16%">☕</span><span class="deco" style="right:4%;top:30%;animation-delay:1s">📚</span><span class="deco" style="left:6%;bottom:8%;animation-delay:2s">🥐</span><span class="deco" style="right:8%;bottom:4%;animation-delay:3s">🕯️</span><span class="deco" style="left:48%;top:3%;animation-delay:4s">🌧️</span>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const DFX=[{id:1,n:"MC and Breakfast",s:"09:00",e:"10:00",rep:1},{id:2,n:"GYM + NC",s:"23:30",e:"01:30",rep:1}];
let S;try{S=JSON.parse(localStorage.pw)}catch(e){}
S=Object.assign({tasks:[],xp:0,spent:0,log:[],park:[],mc:0,
 chars:[], cm:[],hid:[],pop:{on:true,every:10,mute:false,tts:false,focus:false,voice:''},
 fx:DFX.map(d=>({...d})),plan:null,
 bk:{day:"",cnt:{},used:[],cur:null,ex:[],def:[{id:"d1",t:"Take a 15-minute walk",need:2},{id:"d2",t:"Call your family",need:1},{id:"d3",t:"Watch an episode of your show",need:1},{id:"d4",t:"Fill your bottle and have a chat with family",need:0}]},
 tm:{dur:5400,endAt:null,rem:5400,start:null,task:null},ret:"",awarded:{}},S||{});
const save=()=>{try{localStorage.pw=JSON.stringify(S)}catch(e){toast('Could not save in this browser. Storage may be full or blocked.')}};
const uid=()=>Date.now()+Math.random();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('s');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('s'),4200);
 for(let i=0;i<8;i++){const e=document.createElement('div');e.className='sp';e.textContent='✦';e.style.left=(40+Math.random()*80)+'px';e.style.top=(innerHeight-60)+'px';document.body.append(e);setTimeout(()=>e.remove(),1000)}}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function praise(k,t){const p={sub:[`Finished: ${t}. Small steps are still steps.`,`"${t}" done. That's real progress.`],
 task:[`You completed "${t}" — you did what you committed to.`,`"${t}" is finished. Beautiful work.`],
 start:["You began despite the resistance. That counts for a lot."],back:["You returned after the break — that's the hard part."]};toast(pick(p[k]))}
function xp(n,key){if(key){if(S.awarded[key])return;S.awarded[key]=1}S.xp+=n;save();render()}
const lvl=()=>Math.floor(S.xp/100)+1;

// Timer (timestamp based)
const T=()=>S.tm;
function left(){return T().endAt?Math.max(0,Math.round((T().endAt-Date.now())/1000)):T().rem}
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function runMs(){const t=T();return Math.min((t.ran||0)+(t.endAt&&t.seg?Date.now()-t.seg:0),t.dur*1000)}
function startStudy(){const s=focusSlot()||SL().find(x=>x.k=='study'&&x.st=='lock'&&x.e>nowM()),t=T();if(t.endAt)return;
 if(t.rem<=0)t.rem=t.dur;
 const fresh=!t.start;periodic.t=Date.now();try{if('Notification' in window&&Notification.permission=='default')Notification.requestPermission()}catch(e){}
 if(s&&s.st=='lock'){s.st='act';s.rev=1}
 t.endAt=Date.now()+t.rem*1000;t.seg=Date.now();t.start=t.start||Date.now();
 if(fresh){xp(5,'start'+dk()+(s?s.s:'x'));say('start',1);praise('start')}
 save();render();tick()}
function pauseT(){const t=T();if(t.endAt){t.ran=runMs();t.seg=null;t.rem=left();t.endAt=null;save();render();tick()}else startStudy()}
function focusEnd(){const t=T(),s=SL().find(x=>x.st=='act');logMin();t.endAt=null;xp(20);t.rem=t.dur;
 if(s)completeSlot(s);
 say('session',1,{m:(S.log[S.log.length-1]||{}).m});beep();
 const nx=s&&nextSlot(s);
 if(nx&&nx.k=='break'){startBreak(30);nav('brk');toast('Focus complete. Your break has started.')}else toast('Focus session complete!');
 notify('PragyaSpace','Focus session complete');save();render()}
function logMin(){const t=T(),m=Math.round(runMs()/60000);if(m>0)S.log.push({m,d:dk()});t.start=null;t.ran=0;t.seg=null}
function tick(){const l=left();$('#cd').textContent=$('#fcd').textContent=fmt(l);periodic();if(rollover())render();
 const mk=Math.floor(Date.now()/6e4);if(tick.m!==mk){tick.m=mk;render()}
 const p=(1-l/T().dur)*100;$('#fpg').style.width=p+'%';
 const n=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});$('#fnow').textContent=n;
 if(T().endAt&&l<=0)focusEnd();

 if(S.brk){const r=Math.max(0,Math.round((S.brk-Date.now())/1000));$('#bcd').textContent=fmt(r);const mn=Math.ceil(r/60),t10=Math.ceil(mn/10)*10;if(r>0&&t10>0&&t10<(S.brkLast||0)){S.brkLast=t10;say('brk',1,{r:mn,f:nextFirst()});save()}if(!r&&!S.brkDone){S.brkDone=1;beep();say('brkend',1,{f:nextFirst()});toast('Break finished. Return to study when you are ready.')}}else $('#bcd').textContent='30:00'}
setInterval(tick,500);
let AC;const mkAC=()=>AC=AC||new(window.AudioContext||window.webkitAudioContext)();addEventListener('pointerdown',()=>{try{mkAC().resume()}catch(e){}},{once:true});
function notify(t,b,i){try{if('Notification' in window&&Notification.permission==='granted'){new Notification(t,{body:b,icon:i||undefined});return true}}catch(e){}return false}
function beep(){try{const a=mkAC();if(a.state=='suspended')a.resume();const o=a.createOscillator(),g=a.createGain();o.frequency.value=660;g.gain.value=.15;o.connect(g).connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+1.4);o.stop(a.currentTime+1.4)}catch(e){}}
function breakDone(){const c=S.bk.cur;if(!S.brk||!c||c.done)return;c.done=true;const n=nowM(),x=SL().find(y=>y.k=='break'&&n>=y.s&&n<y.e);if(x)x.ck=true;toast('Break task done. Nice.');xp(5)}
function returnStudy(){nav('dash');if(!S.brk)return;const nx=SL().find(y=>y.k=='study'&&y.st=='lock'&&y.e>nowM()&&!y.rev);
 if(nx&&nx.s>nowM()){nx.rev=1;if(!nx.it.length)assign()}S.brk=null;toast('Back to study. Press ▶ to begin.');say('back',1);xp(10,'ret'+Date.now()%1e7);praise('back');save();render()}
function openFocus(){$('#focus').style.display='flex'}function closeFocus(){$('#focus').style.display='none';if(document.fullscreenElement)document.exitFullscreen()}

// Tasks
function addTask(){const t=$('#nt').value.trim(),m=Math.min(24,Math.max(0,Math.floor(+$('#tmh').value||0)))*60+Math.max(0,Math.round(+$('#tmm').value||0));if(!t)return;if(!(m>=5))return toast('Add an expected time of at least 5 minutes (hours and minutes).');
 S.tasks.push({id:uid(),t,pri:$('#pri').value,min:m,rem:m,day:'tomorrow',subs:[],done:false,s:'',e:''});$('#nt').value='';save();assign();render()}
function smaller(id){const t=S.tasks.find(x=>x.id==id);const w=t.t;
 const steps=/\b(read|reading|book|chapter)/i.test(w)?['Sit at your desk','Open the book','Read the title and first paragraph','Read two more pages','Note one key point']:
 /\b(write|writing|essay|draft|statement)/i.test(w)?['Open the document','Read the last paragraph you wrote','Write one sentence','Write three more','Read it back once']:
 ['Sit at your desk','Open your laptop','Open the document for: '+w,'Read the title','Do the very first action','Write one sentence']; 
 t.subs=steps.map(s=>({t:s,d:false}));save();render()}
function tickSub(id,i){const t=S.tasks.find(x=>x.id==id),s=t.subs[i];s.d=!s.d;if(s.d){xp(10,'s'+id+i);praise('sub',s.t);say('task',1,{t:s.t})}
 if(t.subs.every(x=>x.d)&&!t.done)finish(t);save();render()}
function tickTask(id){const t=S.tasks.find(x=>x.id==id);t.done=!t.done;if(t.done)finish(t);save();render()}
function finish(t){t.done=true;assign();xp(30,'m'+t.id);S.mc=S.tasks.filter(x=>x.done).length;praise('task',t.t);say('task',1,{t:t.t});if(S.tasks.filter(x=>x.day=='today').every(x=>x.done)){toast("You've finished your study missions. Your evening is yours.");say('day',1)}}

// Praise engine

 over=pool.reduce((a,p)=>a+p.r,0)>sl.reduce((a,s)=>a+s.e-s.s,0);
 sl.forEach(s=>{s.it=[];let c=s.e-s.s;[0,1].forEach(ps=>pool.forEach(p=>{if(c<10||p.r<=0||(s.ban||[]).includes(p.t.id)||s.it.some(i=>i.id==p.t.id))return;
  if(ps==0&&((p.r>c&&p.r<=90)||(p.r>90&&c<60)))return;if(ps==1&&s.it.length&&!over)return;
  const m=Math.min(p.r,c);s.it.push({id:p.t.id,m,t:p.t.t});p.r-=m;c-=m}))});
 return pool.filter(p=>p.r>0).map(p=>({id:p.t.id,t:p.t.t,r:p.r}))}
function assign(){if(!S.plan)return;const L=SL(),n=nowM(),re=x=>x.k=='study'&&x.st=='lock'&&(!x.it.length||(!x.rev&&n<x.s)),sl=L.filter(re),
 hold=L.filter(x=>x.k=='study'&&!re(x)&&['lock','act','end'].includes(x.st)).flatMap(x=>x.it);
 S.plan.nofit=pack(sl,S.tasks.filter(t=>t.day=='today'),hold,S.seed)}
const hs=id=>String(id).split('').reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7)%997/997;
const hmn=m=>m>=60?Math.floor(m/60)+'h'+(m%60?' '+m%60+'m':''):m+' min';
function tomorrowPlan(){const L=buildSlots(S.fx.filter(f=>f.rep||f.tm),[],540),sl=L.filter(x=>x.k=='study'),
 nofit=pack(sl,S.tasks.filter(t=>t.day=='tomorrow'),[],S.shuf),cap=sl.reduce((a,s)=>a+s.e-s.s,0),used=sl.reduce((a,s)=>a+s.it.reduce((b,i)=>b+i.m,0),0);
 return{L,nofit,cap,used,free:cap-used}}
function capText(t){const x=t.nofit.reduce((a,p)=>a+p.r,0);return hmn(t.used)+' planned of '+hmn(t.cap)+' study time · '+hmn(t.free)+' free'+(x?' · '+hmn(x)+" won't fit":'')}
function hk(){const L=SL(),n=nowM();let ch=0;L.forEach((x,i)=>{if(x.k!='study')return;if(x.st=='lock'&&n>=x.e){x.st='skip';ch=1}
 if(x.st=='end'){const nx=L.slice(i+1).find(y=>y.k=='study');if(nx&&n>=nx.s){x.st='skip';ch=1}}});
 if(ch||L.some(x=>x.k=='study'&&x.st=='lock'&&!x.it.length&&n<x.e))assign()}
function focusSlot(){const n=nowM(),L=SL();return L.find(x=>x.k=='study'&&x.st=='act')||L.find(x=>x.k=='study'&&x.st=='end'&&n<x.e+60)||L.find(x=>x.k=='study'&&x.st=='lock'&&(x.rev||(n>=x.s&&n<x.e)))||null}
function pushTomorrow(){(S.plan.nofit||[]).forEach(x=>{const t=S.tasks.find(y=>y.id==x.id);if(!t)return;if(x.r>=t.rem)t.day='tomorrow';else{t.rem-=x.r;S.tasks.push({...t,id:uid(),day:'tomorrow',rem:x.r,min:x.r,subs:[],done:false})}});assign();save();render()}
const fk=f=>{const a=tmin(f.s);return a<360?a+1440:a};
function addFx(){const n=$('#fn').value.trim(),s=$('#fs').value,e=$('#fe').value;if(!n||!s||!e)return toast('Add a name, a start time and an end time.');if(s==e)return toast('Start and end times must be different.');S.fx.push({id:uid(),n,s,e,rep:$('#fr').checked?1:0,tm:$('#fr').checked?0:1});['#fn','#fs','#fe'].forEach(x=>$(x).value='');mkPlan();render()}
function delFx(i){S.fx.splice(i,1);mkPlan();render()}
function shuffleTmr(){if(S.tasks.filter(t=>t.day=='tomorrow'&&!t.done).length<2)return toast('Add at least two missions for tomorrow to shuffle them.');
 const sig=()=>tomorrowPlan().L.map(x=>x.it.map(i=>i.id+':'+i.m).join(',')).join('|'),b=sig();
 for(let i=0;i<12;i++){S.shuf=1+Math.floor(Math.random()*1e6);if(sig()!=b)break}
 if(sig()==b)toast('That is the only order that fits tomorrow.');save();render()}
function nextFirst(){const n=nowM(),x=SL().find(y=>y.k=='study'&&y.e>n&&y.it.length);return x?x.it[0].t:''}
// ----- breaks: a fresh, non-repeating idea every time -----
const LIB=['Fill your water bottle and drink a full glass','Stretch your neck, shoulders and back for 5 minutes','Look out of a window at something far away and let your eyes rest','Make tea or coffee and drink it without your phone','Play one favourite song and dance badly','Tidy one small corner of your desk','Eat a snack or some fruit, slowly','Lie down, close your eyes, take 10 slow breaths','Text a friend something kind','Wash your face and freshen up','Do 20 squats and 10 push-ups','Step outside for fresh air and sunlight','Doodle freely for 10 minutes','Sit somewhere comfy and do absolutely nothing'];
function bkPool(){const B=S.bk;return[...B.def.map(d=>({id:d.id,t:d.t,need:d.need||0})),...B.ex.filter(x=>x.day==dk()).map(d=>({id:d.id,t:d.t,need:1})),...LIB.map((t,i)=>({id:'L'+i,t,need:0}))]}
function pickBreak(avoid){const B=S.bk;if(B.day!=dk()){B.day=dk();B.cnt={};B.used=[];B.ex=B.ex.filter(x=>x.day==dk())}
 const P=bkPool(),last=B.used[B.used.length-1],left=Math.max(1,SL().filter(x=>x.k=='break'&&x.e>nowM()).length),owed=P.reduce((a,p)=>a+Math.max(0,p.need-(B.cnt[p.id]||0)),0),
 must=P.filter(p=>p.need>(B.cnt[p.id]||0)&&p.id!=last&&p.id!=avoid),fresh=P.filter(p=>!B.used.includes(p.id)&&p.id!=avoid);
 const c=must.length&&(owed>=left||Math.random()<.5)?pick(must):pick(fresh.length?fresh:P.filter(p=>p.id!=last&&p.id!=avoid));
 B.cnt[c.id]=(B.cnt[c.id]||0)+1;B.used.push(c.id);return{id:c.id,t:c.t}}
function addBd(){const t=$('#bd').value.trim();if(!t)return;S.bk.def.push({id:'d'+uid(),t,need:0});$('#bd').value='';save();render()}
// ----- rendering -----
function lab(i,L){const a=(L||SL()).filter(x=>x.k=='study'&&x.st!='skip').flatMap(x=>x.it).filter(y=>y.id==i.id),k=a.indexOf(i);return a.length>1&&k>=0?` (${k+1}/${a.length})`:''}
const studyTxt=(x,L)=>x.it.map(y=>esc(y.t)+lab(y,L)).join(' + ')||'Free';
const rowTxt=(x,L)=>x.k=='fx'?esc(x.n):x.k=='break'?'Rest':x.k=='free'?'Free':studyTxt(x,L);
function planRow(x){const n=nowM(),cur=n>=x.s&&n<x.e,old=x.e<=n&&!x.ck;
 return `<div class="task${cur?' slot':''}${old?' old':''}"><input type="checkbox" class="chk" ${x.ck?'checked':''} onchange="tickPlan(${SL().indexOf(x)})"><span class="small">${rng(x.s,x.e)}</span> <span class="${x.ck?'done':''}">${rowTxt(x,SL())}</span></div>`}
function completeSlot(s){s.st='done';s.ck=true;s.it.forEach(i=>{const k=S.tasks.find(y=>y.id==i.id);if(k){k.rem-=i.m;if(k.rem<=0&&!k.done)finish(k)}});assign()}
function tickPlan(i){const x=SL()[i];if(!x)return;x.ck=!x.ck;if(x.ck&&x.k=='study'&&['lock','act','end'].includes(x.st))completeSlot(x);save();render()}
function panel(){const f=focusSlot();$('#ftask').textContent=f&&f.st!='end'?f.it.map(y=>y.t+lab(y)).join(' + '):'';$('#pbtn').textContent=T().endAt?'⏸':'▶'}
function render(){rollover();if(!S.plan||S.plan.d!=dk())mkPlan();hk();panel();const L=SL().filter(x=>x.e>x.s),st=L.filter(x=>x.k=='study'),dn=st.filter(x=>x.ck).length;
 $('#mission').innerHTML=L.map(planRow).join('');
 const tp=tomorrowPlan();$('#tmr').innerHTML=tp.L.filter(x=>x.e>x.s).map(x=>`<div class="task"><span class="small">${rng(x.s,x.e)}</span> ${rowTxt(x,tp.L)}</div>`).join('');$('#cap').textContent=capText(tp);$('#mcount').textContent=dn+' of '+st.length+' done';
 $('#tl').innerHTML=S.tasks.map(t=>`<div class="li"><span class="${t.done?'done':''}">${esc(t.t)}</span><span class="small">${hmn(t.min)}${t.day=='today'?' · today':''}</span><span class="pr ${t.pri}">${t.pri}</span><button class="fb" onclick="delTask(${t.id})">×</button></div>`).join('');
 const nf=S.plan.nofit||[];$('#nofit').innerHTML=nf.length?`<div class="bub" style="font-style:normal">⚠️ Won't fit today: ${nf.map(x=>esc(x.t)+' ('+hmn(x.r)+')').join(', ')}. <button class="fb" onclick="pushTomorrow()">Move to tomorrow</button></div>`:'';
 $('#fxl').innerHTML=S.fx.map((f,i)=>({f,i})).sort((p,q)=>fk(p.f)-fk(q.f)).map(({f,i})=>`<div class="li"><span>${esc(f.n)}</span><span class="small">${rng(tmin(f.s),tmin(f.e)<=tmin(f.s)?tmin(f.e)+1440:tmin(f.e))}${f.rep?'':f.tm?' · tomorrow only':' · today only'}</span><button class="fb" onclick="delFx(${i})">×</button></div>`).join('');
 S.bk.ex=S.bk.ex.filter(x=>x.day==dk());
 $('#bdl').innerHTML=S.bk.def.map((d,i)=>`<div class="li"><span>${esc(d.t)}</span><button class="fb" onclick="S.bk.def.splice(${i},1);save();render()">×</button></div>`).join('');
 const bc=S.brk&&S.bk.cur;$('#bact').textContent=bc?bc.t:'Break Task Coming Soon';$('#bact').classList.toggle('done',!!(bc&&bc.done));$('#bdb').style.display=bc?'':'none';$('#bdb').textContent=bc&&bc.done?'Done ✓':'Done';$('#bdb').disabled=!!(bc&&bc.done);
 renderComp();
 $('#pl').innerHTML=S.park.map((p,i)=>`<div class="task">${esc(p.t)} <button class="fb" onclick="S.park.splice(${i},1);save();render()">Delete</button></div>`).join('')||'<p class="small">Nothing parked.</p>';
 save()}
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(e.key=='Escape'){closeFocus();closeSos();return}
 const tg=e.target.tagName;if(/INPUT|TEXTAREA|SELECT/.test(tg))return;
 const sosOn=$('#sos').style.display=='flex',focOn=$('#focus').style.display=='flex',k=e.key.toLowerCase();
 if(sosOn)return;
 if(e.code=='Space'){if(tg=='BUTTON'||tg=='A')return;if(!focOn&&!$('#dash').classList.contains('on'))return;e.preventDefault();pauseT();return}
 if(k=='f')openFocus();if(k=='s')openSos()});
render();tick();setTimeout(()=>say('open',1),1200);
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
